<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cloud Admin | TAVISH &amp; CO.</title><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/heritage-shopping-v10.css"><style>
.cloud-wrap{max-width:1200px;margin:0 auto;padding:24px}.cloud-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:20px 0}.cloud-panel{background:#fff;border:1px solid #e7dfd3;border-radius:14px;padding:20px;margin:16px 0}.cloud-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.cloud-grid label{display:block;font-size:14px}.cloud-grid input,.cloud-grid textarea,.cloud-grid select{width:100%;padding:10px;border:1px solid #d8d0c4;border-radius:8px;margin-top:5px}.cloud-grid textarea{min-height:90px}.cloud-table{width:100%;border-collapse:collapse}.cloud-table th,.cloud-table td{text-align:left;padding:10px;border-bottom:1px solid #eee6dc;vertical-align:top}.cloud-table img{width:52px;height:52px;object-fit:cover}.cloud-msg{padding:12px;border-radius:8px;background:#f5f0e7;margin:12px 0;white-space:pre-wrap}.cloud-actions{display:flex;gap:8px;flex-wrap:wrap}.cloud-btn{padding:10px 14px;border:0;border-radius:7px;background:#211d19;color:#fff;cursor:pointer}.cloud-btn.alt{background:#b08a43}.cloud-btn:disabled{opacity:.5}.hidden{display:none!important}@media(max-width:700px){.cloud-grid{grid-template-columns:1fr}.cloud-table{font-size:13px}.cloud-wrap{padding:12px}.cloud-panel{padding:12px}.cloud-table th,.cloud-table td{padding:6px}}
</style></head><body><main class="cloud-wrap">
<div class="cloud-head"><div><p>TAVISH &amp; CO.</p><h1>Catalogue Admin</h1><p>Shared catalogue connected to Supabase</p></div><div class="cloud-actions"><a class="cloud-btn" href="../index.html">View storefront</a><button class="cloud-btn" id="signout">Sign out</button></div></div>
<div id="msg" class="cloud-msg" role="status">Checking Admin session…</div>
<section id="workspace" class="hidden">
<div class="cloud-head"><h2>Products</h2><button class="cloud-btn alt" id="newProduct">Add product</button></div>
<section class="cloud-panel hidden" id="editor"><h2 id="editorTitle">Add product</h2><form id="productForm"><input type="hidden" id="pid">
<div class="cloud-grid">
<label>Product name<input id="name" required maxlength="160"></label>
<label>SKU<input id="sku" required maxlength="80"></label>
<label>Slug<input id="slug" required maxlength="180"></label>
<label>Category<select id="category"></select></label>
<label>Subcategory<input id="subcategory"></label>
<label>Price (₹)<input id="price" type="number" min="0" step="0.01" required></label>
<label>Sale price (₹; optional)<input id="salePrice" type="number" min="0" step="0.01"></label>
<label>Availability<select id="availability"><option value="IN_STOCK">In stock</option><option value="OUT_OF_STOCK">Out of stock</option><option value="PREORDER">Preorder</option></select></label>
<label>Status<select id="status"><option value="ACTIVE">Active</option><option value="DRAFT">Draft</option><option value="HIDDEN">Hidden</option><option value="TRASH">Trash</option></select></label>
<label>Primary image path<input id="image" placeholder="assets/images/products/p01-1.jpg"></label>
<label>Material<input id="material"></label><label>Finish<input id="finish"></label>
<label>Description<textarea id="description"></textarea></label>
<label>Tags (comma separated)<input id="tags"></label>
<label><span><input id="featured" type="checkbox"> Featured product</span></label>
<label><span><input id="newArrival" type="checkbox"> New arrival</span></label>
<label><span><input id="bestSeller" type="checkbox"> Best seller</span></label>
</div><p class="cloud-actions"><button class="cloud-btn alt" type="submit">Save to database</button><button class="cloud-btn" type="button" id="cancelEdit">Cancel</button></p></form></section>
<section class="cloud-panel"><div class="cloud-actions"><input id="search" placeholder="Search products…" style="padding:10px;min-width:220px"><button class="cloud-btn" id="refresh">Refresh</button><span id="count"></span></div><div style="overflow:auto"><table class="cloud-table"><thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase-config.js"></script><script>
(function(){
'use strict';
const cfg=window.TAVISH_SUPABASE_CONFIG;const client=window.supabase.createClient(cfg.url,cfg.publishableKey);
const $=id=>document.getElementById(id);const msg=$('msg');let products=[],cats=[];
function say(s){msg.textContent=s;msg.classList.remove('hidden')}
function slugify(s){return String(s||'').toLowerCase().trim().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function money(p){return '₹'+(Number(p||0)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
async function init(){
 const {data:{session},error}=await client.auth.getSession();if(error||!session){location.href='login.html?cloud=1';return}
 const {data:profile,error:pe}=await client.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
 if(pe||!profile||profile.role!=='admin'){say('Signed in, but this account is not assigned the Admin role. Ask the project owner to provision the Admin profile in Supabase.');$('workspace').classList.add('hidden');return}
 $('workspace').classList.remove('hidden');await load();
}
async function load(){say('Loading shared catalogue…');
 const [pr,cr,ir]=await Promise.all([client.from('products').select('*').order('sort_order'),client.from('categories').select('*').order('sort_order'),client.from('product_images').select('*').order('sort_order')]);
 if(pr.error){say('Could not load products: '+pr.error.message);return} if(cr.error){say('Could not load categories: '+cr.error.message);return}
 products=pr.data||[];cats=cr.data||[];(ir.data||[]).forEach(i=>{const p=products.find(x=>x.id===i.product_id);if(p&&(!p.primary_image||i.is_primary))p.primary_image=i.storage_path});$('category').innerHTML=cats.map(c=>'<option value="'+c.id+'" data-name="'+c.name.replace(/"/g,'&quot;')+'" data-slug="'+c.slug+'">'+c.name+'</option>').join('');
 render();say('Connected. '+products.length+' products loaded from the shared database.');
}
function render(){const term=$('search').value.toLowerCase();const list=products.filter(p=>(p.name+' '+p.sku+' '+(p.category_name||'')).toLowerCase().includes(term));$('count').textContent=list.length+' products';
 $('rows').innerHTML=list.map(p=>{const im=(p.primary_image||'').startsWith('http')?p.primary_image:(p.primary_image?'../'+p.primary_image:'');return '<tr><td>'+(im?'<img src="'+im+'" alt="">':'—')+'</td><td><b>'+escape(p.name)+'</b><br><small>'+escape(p.sku)+'</small></td><td>'+escape(p.category_name||'')+'<br><small>'+escape(p.subcategory||'')+'</small></td><td>'+money(p.price_paise)+(p.sale_price_paise?' <small>Sale '+money(p.sale_price_paise)+'</small>':'')+'</td><td>'+escape(p.status)+'</td><td><div class="cloud-actions"><button class="cloud-btn alt" data-edit="'+p.id+'">Edit</button><button class="cloud-btn" data-toggle="'+p.id+'">'+(p.status==='ACTIVE'?'Hide':'Activate')+'</button></div></td></tr>'}).join('');
}
function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reset(){ $('productForm').reset();$('pid').value='';$('editorTitle').textContent='Add product';$('editor').classList.remove('hidden')}
function edit(p){reset();$('pid').value=p.id;$('editorTitle').textContent='Edit product';['name','sku','slug','subcategory','material','finish','description'].forEach(k=>$(k).value=p[k]||'');$('category').value=p.category_id||'';$('price').value=(p.price_paise/100).toFixed(2);$('salePrice').value=p.sale_price_paise==null?'':(p.sale_price_paise/100).toFixed(2);$('availability').value=p.availability;$('status').value=p.status;$('image').value=p.primary_image||'';$('tags').value=(p.tags||[]).join(', ');$('featured').checked=!!p.featured;$('newArrival').checked=!!p.new_arrival;$('bestSeller').checked=!!p.best_seller;$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();const c=$('category').selectedOptions[0];const payload={name:$('name').value.trim(),sku:$('sku').value.trim(),slug:$('slug').value.trim()||slugify($('name').value),category_id:$('category').value||null,category_name:c?.dataset.name||'',subcategory:$('subcategory').value.trim(),price_paise:Math.round(Number($('price').value)*100),sale_price_paise:$('salePrice').value===''?null:Math.round(Number($('salePrice').value)*100),availability:$('availability').value,status:$('status').value,material:$('material').value.trim(),finish:$('finish').value.trim(),description:$('description').value.trim(),tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),featured:$('featured').checked,new_arrival:$('newArrival').checked,best_seller:$('bestSeller').checked,updated_at:new Date().toISOString()};
const id=$('pid').value;const result=id?await client.from('products').update(payload).eq('id',id).select().single():await client.from('products').insert(payload).select().single();if(result.error){say('Save failed: '+result.error.message);return}const saved=result.data;const imagePath=$('image').value.trim();if(imagePath){const ir=await client.from('product_images').upsert({product_id:saved.id,storage_path:imagePath,alt_text:saved.name,sort_order:1,is_primary:true},{onConflict:'product_id,storage_path'});if(ir.error){say('Product saved, but image reference failed: '+ir.error.message);return}}say('Product saved to Supabase.');$('editor').classList.add('hidden');await load();});
$('rows').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.toggle;const p=products.find(x=>x.id===id);if(!p)return;if(b.dataset.edit){edit(p);return}const next=p.status==='ACTIVE'?'HIDDEN':'ACTIVE';const {error}=await client.from('products').update({status:next,updated_at:new Date().toISOString()}).eq('id',id);if(error){say('Update failed: '+error.message);return}say('Product status updated.');await load();});
$('newProduct').onclick=reset;$('cancelEdit').onclick=()=>$('editor').classList.add('hidden');$('refresh').onclick=load;$('search').oninput=render;$('signout').onclick=async()=>{await client.auth.signOut();location.href='login.html?cloud=1'};init().catch(e=>say('Admin initialization failed: '+e.message));
})();
</script></body></html>

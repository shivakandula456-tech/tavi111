<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Secure Admin Sign In | TAVISH &amp; CO.</title><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/heritage-shopping-v10.css"><style>body{background:#fbf8f3}.auth-card{max-width:460px;margin:8vh auto;background:white;border:1px solid #e7dfd3;border-radius:16px;padding:30px;box-shadow:0 12px 40px #211d190b}.auth-card input{display:block;width:100%;padding:12px;border:1px solid #d8d0c4;border-radius:8px;margin:6px 0 16px}.auth-btn{width:100%;padding:12px;background:#211d19;color:white;border:0;border-radius:8px;cursor:pointer}.notice{padding:12px;background:#f4efe7;border-radius:8px;white-space:pre-wrap}</style></head><body><main class="auth-card"><img src="../assets/images/brand/tavish-co-logo.png" alt="TAVISH &amp; CO." width="160"><h1>Secure Admin Sign In</h1><p>Sign in with the Admin account created in Supabase Authentication.</p><div id="notice" class="notice" role="status">Loading secure sign-in…</div><form id="form" hidden><label>Email<input type="email" id="email" autocomplete="username" required></label><label>Password<input type="password" id="password" autocomplete="current-password" required></label><button class="auth-btn" type="submit">Sign in securely</button></form><p><a href="../index.html">Back to storefront</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase-config.js"></script><script>
(async function(){const client=window.supabase.createClient(window.TAVISH_SUPABASE_CONFIG.url,window.TAVISH_SUPABASE_CONFIG.publishableKey);const form=document.getElementById('form'),notice=document.getElementById('notice');function say(t){notice.textContent=t}form.hidden=false;const {data:{session}}=await client.auth.getSession();if(session){location.href='cloud-catalogue.html';return}form.addEventListener('submit',async e=>{e.preventDefault();const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){say('Sign in failed: '+error.message);return}const {data:profile,error:pe}=await client.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe||!profile||profile.role!=='admin'){await client.auth.signOut();say('This account is not assigned the Admin role yet. Follow the setup steps to provision the first Admin profile, then sign in again.');return}location.href='cloud-catalogue.html'});})();
</script></body></html>

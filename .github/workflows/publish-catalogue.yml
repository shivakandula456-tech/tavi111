name: Publish TAVISH & CO. catalogue to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/catalogue-publish.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tavish-pages-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate catalogue and generate site data
        run: python scripts/publish_catalogue.py

      - name: Commit generated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.js data/categories.js data/settings.js assets/js/storage.js data/catalogue-publish.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Publish updated TAVISH & CO. catalogue"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
